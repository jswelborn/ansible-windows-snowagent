---
- name: Check and remediate Windows ServiceNow ACC service
  hosts: all
  gather_facts: false

  vars:
    service_name: AgentClientCollector

  tasks:
    - name: Gather ServiceNow ACC service info
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: servicenow_service_info
      ignore_unreachable: true

    - name: End compliance check for unreachable host
      ansible.builtin.meta: end_host
      when: servicenow_service_info is ansible.builtin.unreachable

    - name: Fail if ServiceNow ACC service is missing
      ansible.builtin.fail:
        msg: "ServiceNow ACC service is missing"
      when: not servicenow_service_info.exists

    - name: Start ServiceNow ACC service when it is stopped
      ansible.windows.win_service:
        name: "{{ service_name }}"
        state: started
        start_mode: auto
      when:
        - servicenow_service_info.exists
        - servicenow_service_info.services[0].state != "started"

    - name: Refresh ServiceNow ACC service info after remediation
      ansible.windows.win_service_info:
        name: "{{ service_name }}"
      register: servicenow_remediation_info
      ignore_unreachable: true

    - name: End compliance check if host became unreachable
      ansible.builtin.meta: end_host
      when: servicenow_remediation_info is ansible.builtin.unreachable

    - name: Fail if ServiceNow ACC service is still not running
      ansible.builtin.fail:
        msg: "ServiceNow ACC service exists but could not be started"
      when:
        - servicenow_remediation_info.exists
        - servicenow_remediation_info.services[0].state != "started"